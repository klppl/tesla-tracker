<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-overlay: rgba(56, 189, 248, 0.2);
            --secondary-accent: #818cf8;
            --tertiary-accent: #f472b6;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--accent), var(--secondary-accent), var(--tertiary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 3rem;
            text-align: center;
            font-size: 1.1rem;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            color: var(--text-primary);
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 30px;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 5px 0;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0 0 20px 0;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        /* Scatter plot pointer on canvas */
        .chart-container.scatter-chart canvas {
            cursor: pointer;
        }

        .year-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .year-filter-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .year-filter-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .year-filter-btn.active {
            background: var(--accent-overlay);
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            font-size: 1.2rem;
            border: 1px dashed var(--border);
            border-radius: 16px;
            width: 100%;
        }

        @media (max-width: 1000px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Tesla Analytics</h1>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const rawData = document.getElementById('chart-data').textContent;
            if (!rawData || rawData.trim() === "{}") return;

            const analyticsData = JSON.parse(rawData);

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Inter', sans-serif";

            // 1. Render Daily Additions
            if (analyticsData.daily_additions && analyticsData.daily_additions.dates.length > 0) {
                const ctxDaily = document.getElementById('chart-daily-additions').getContext('2d');
                new Chart(ctxDaily, {
                    type: 'bar',
                    data: {
                        labels: analyticsData.daily_additions.dates,
                        datasets: [{
                            label: 'Nya bilar tillagda',
                            data: analyticsData.daily_additions.counts,
                            backgroundColor: 'rgba(244, 114, 182, 0.7)',
                            borderColor: '#f472b6',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { grid: { display: false } },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' }
                            }
                        }
                    }
                });
            }

            // 2. Render Aggregated Scatter (all models) with year filters
            if (analyticsData.scatter_all && analyticsData.scatter_all.length > 0) {
                const modelColors = {
                    'Tesla Model 3': '#38bdf8',
                    'Tesla Model Y': '#f472b6',
                    'Tesla Model S': '#34d399',
                    'Tesla Model X': '#fbbf24',
                };
                const defaultColor = '#a78bfa';
                const allPoints = analyticsData.scatter_all;

                // Collect unique years and build filter buttons
                const allYears = [...new Set(allPoints.map(pt => pt.year))].filter(Boolean).sort();
                const activeYears = new Set(allYears);
                const filtersContainer = document.getElementById('year-filters');

                function renderFilterButtons() {
                    filtersContainer.innerHTML = '';
                    allYears.forEach(year => {
                        const btn = document.createElement('button');
                        btn.className = 'year-filter-btn' + (activeYears.has(year) ? ' active' : '');
                        btn.textContent = year;
                        btn.addEventListener('click', () => {
                            if (activeYears.has(year)) {
                                activeYears.delete(year);
                            } else {
                                activeYears.add(year);
                            }
                            btn.classList.toggle('active');
                            updateScatterAll();
                        });
                        filtersContainer.appendChild(btn);
                    });
                }

                function buildDatasets(points) {
                    const byModel = {};
                    points.forEach(pt => {
                        const m = pt.model || 'Okänd';
                        if (!byModel[m]) byModel[m] = [];
                        byModel[m].push(pt);
                    });
                    return Object.keys(byModel).sort().map(model => {
                        const color = modelColors[model] || defaultColor;
                        return {
                            label: model,
                            data: byModel[model],
                            backgroundColor: color + '99',
                            borderColor: color,
                            pointRadius: 6,
                            pointHoverRadius: 9,
                            pointHoverBackgroundColor: '#fff',
                        };
                    });
                }

                const ctxAll = document.getElementById('chart-scatter-all').getContext('2d');
                const scatterAllChart = new Chart(ctxAll, {
                    type: 'scatter',
                    data: { datasets: buildDatasets(allPoints) },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        onClick: (e, elements, chart) => {
                            if (elements.length > 0) {
                                const el = elements[0];
                                const pt = chart.data.datasets[el.datasetIndex].data[el.index];
                                if (pt.url) window.open(pt.url, '_blank');
                            }
                        },
                        plugins: {
                            tooltip: {
                                backgroundColor: 'rgba(30, 41, 59, 0.95)',
                                titleColor: '#f8fafc',
                                padding: 15,
                                callbacks: {
                                    label: function (ctx) {
                                        const pt = ctx.raw;
                                        const price = new Intl.NumberFormat('sv-SE').format(pt.y);
                                        const mil = new Intl.NumberFormat('sv-SE').format(pt.x);
                                        return [
                                            `${pt.model} – ${pt.year} ${pt.version}`,
                                            `Pris: ${price} kr`,
                                            `Miltal: ${mil} mil`,
                                            `Klicka för att öppna annonsen!`
                                        ];
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Miltal (mil)' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            y: {
                                title: { display: true, text: 'Pris (kr)' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            }
                        }
                    }
                });

                function updateScatterAll() {
                    const filtered = allPoints.filter(pt => activeYears.has(pt.year));
                    scatterAllChart.data.datasets = buildDatasets(filtered);
                    scatterAllChart.update();
                }

                renderFilterButtons();
            }

            // 3. Render Model Specific Charts
            const modelsContainer = document.getElementById('models-container');

            for (const modelName of Object.keys(analyticsData.averages)) {

                const avgData = analyticsData.averages[modelName];
                const scatterData = analyticsData.scatter[modelName] || [];

                // Create Section Title
                const sectionHeader = document.createElement('h2');
                sectionHeader.className = 'section-title';
                sectionHeader.textContent = modelName;
                modelsContainer.appendChild(sectionHeader);

                // Create row layout for side-by-side charts
                const row = document.createElement('div');
                row.className = 'charts-row';

                // --- Average Chart Card ---
                const avgCard = document.createElement('div');
                avgCard.className = 'chart-card';
                avgCard.innerHTML = `
                    <h3 class="chart-title">Pris- och miltrender</h3>
                    <p class="chart-subtitle">Aggregerat per årsmodell. Staplar = Pris, Linje = Miltal.</p>
                    <div class="chart-container">
                        <canvas id="avg-chart-${modelName.replace(/\s+/g, '-')}"></canvas>
                    </div>
                `;

                // --- Scatter Chart Card ---
                const scatterCard = document.createElement('div');
                scatterCard.className = 'chart-card';
                scatterCard.innerHTML = `
                    <h3 class="chart-title">Fynd-radar (Pris vs Miltal)</h3>
                    <p class="chart-subtitle">Nedre vänstra hörnet = Bästa köpet! Klicka på punkter för att öppna annonsen.</p>
                    <div class="chart-container scatter-chart">
                        <canvas id="scatter-chart-${modelName.replace(/\s+/g, '-')}"></canvas>
                    </div>
                `;

                row.appendChild(avgCard);
                row.appendChild(scatterCard);
                modelsContainer.appendChild(row);

                // Initialize Average Combo Chart
                const ctxAvg = document.getElementById(`avg-chart-${modelName.replace(/\s+/g, '-')}`).getContext('2d');
                new Chart(ctxAvg, {
                    type: 'bar',
                    data: {
                        labels: avgData.years,
                        datasets: [
                            {
                                label: 'Snittpris (kr)',
                                data: avgData.prices,
                                type: 'bar',
                                backgroundColor: 'rgba(56, 189, 248, 0.5)',
                                borderColor: '#38bdf8',
                                borderWidth: 1,
                                borderRadius: 4,
                                order: 2,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Snittmiltal (mil)',
                                data: avgData.mileages,
                                type: 'line',
                                borderColor: '#818cf8',
                                backgroundColor: '#818cf8',
                                borderWidth: 3,
                                pointBackgroundColor: '#0f172a',
                                pointBorderColor: '#818cf8',
                                pointBorderWidth: 2,
                                tension: 0.3,
                                order: 1,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            tooltip: {
                                backgroundColor: 'rgba(30, 41, 59, 0.9)',
                                titleColor: '#f8fafc',
                                callbacks: {
                                    label: function (context) {
                                        let v = new Intl.NumberFormat('sv-SE').format(context.parsed.y);
                                        let label = `${context.dataset.label}: ${v}`;
                                        if (context.datasetIndex === 0) {
                                            label += ` (Count: ${avgData.counts[context.dataIndex]})`;
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { display: false } },
                            y: { position: 'left', title: { display: true, text: 'Pris (kr)' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y1: { position: 'right', title: { display: true, text: 'Miltal (mil)' }, grid: { drawOnChartArea: false } }
                        }
                    }
                });

                // Initialize Scatter Chart
                const colors = ['#38bdf8', '#818cf8', '#f472b6', '#34d399', '#fbbf24', '#a78bfa'];
                // Group scatter data by Year to give them different colors/labels
                const datasetsByYear = {};
                scatterData.forEach(pt => {
                    const y = pt.year || 'Unknown';
                    if (!datasetsByYear[y]) datasetsByYear[y] = [];
                    datasetsByYear[y].push(pt);
                });

                const scatterDatasets = Object.keys(datasetsByYear).sort().map((year, idx) => {
                    return {
                        label: year,
                        data: datasetsByYear[year],
                        backgroundColor: colors[idx % colors.length] + '99', // adding transparency
                        borderColor: colors[idx % colors.length],
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        pointHoverBackgroundColor: '#fff',
                    }
                });

                const ctxScatter = document.getElementById(`scatter-chart-${modelName.replace(/\s+/g, '-')}`).getContext('2d');
                new Chart(ctxScatter, {
                    type: 'scatter',
                    data: { datasets: scatterDatasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        onClick: (e, elements, chart) => {
                            if (elements.length > 0) {
                                const el = elements[0];
                                const pt = chart.data.datasets[el.datasetIndex].data[el.index];
                                if (pt.url) window.open(pt.url, '_blank');
                            }
                        },
                        plugins: {
                            tooltip: {
                                backgroundColor: 'rgba(30, 41, 59, 0.95)',
                                titleColor: '#f8fafc',
                                padding: 15,
                                callbacks: {
                                    label: function (ctx) {
                                        const pt = ctx.raw;
                                        const price = new Intl.NumberFormat('sv-SE').format(pt.y);
                                        const mil = new Intl.NumberFormat('sv-SE').format(pt.x);
                                        return [
                                            `${pt.year} ${pt.version}`,
                                            `Pris: ${price} kr`,
                                            `Miltal: ${mil} mil`,
                                            `Klicka för att öppna annonsen!`
                                        ];
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Miltal (mil)' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            y: {
                                title: { display: true, text: 'Pris (kr)' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            }
                        }
                    }
                });
            }
        });
    </script>
