name: Scrape & Build

on:
  schedule:
    - cron: '0 6 * * *' # Varje dag kl 06:00 UTC
  workflow_dispatch: # Manuell körning

permissions:
  contents: write

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install flask requests minify-html --system

      - name: Run scraper
        run: python scraper.py 2>&1 | tee /tmp/scraper-output.txt

      - name: Generate static site
        run: python app.py --static 2>&1 | tee /tmp/build-output.txt

      - name: Write log entry
        run: |
          mkdir -p public
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "=== $TIMESTAMP ==="
            echo ""
            echo "--- Scraper ---"
            cat /tmp/scraper-output.txt
            echo ""
            echo "--- Static build ---"
            cat /tmp/build-output.txt
            echo ""
            echo ""
          } > /tmp/new-entry.txt
          if [ -f public/log.txt ]; then
            cat /tmp/new-entry.txt public/log.txt > /tmp/merged-log.txt
            mv /tmp/merged-log.txt public/log.txt
          else
            mv /tmp/new-entry.txt public/log.txt
          fi

      - name: Commit updated data and static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesla_cars.db public/
          git diff --staged --quiet || git commit -m "Daglig uppdatering: scrape + static build"
          git push
